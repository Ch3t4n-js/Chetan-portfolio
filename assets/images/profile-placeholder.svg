<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bg-grad)" />

  <!-- Technical Grid Elements (Engineering Theme) -->
  <path d="M40 0 v400 M80 0 v400 M120 0 v400 M160 0 v400 M200 0 v400 M240 0 v400 M280 0 v400 M320 0 v400 M360 0 v400" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/>
  <path d="M0 40 h400 M0 80 h400 M0 120 h400 M0 160 h400 M0 200 h400 M0 240 h400 M0 280 h400 M0 320 h400 M0 360 h400" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Mechanical Blueprint Compass / Ring Accent -->
  <circle cx="200" cy="180" r="145" fill="none" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="130" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Mechanical Gear Accent in Corner -->
  <g transform="translate(310, 60) scale(0.6)" fill="url(#gear-grad)" opacity="0.75">
    <path d="M30 18 L26 18 C25 14 23 11 20 8 L23 4 L18 0 L15 3 C11 2 7 2 4 4 L1 1 L-3 5 L0 8 C-3 11 -4 15 -5 19 L-9 19 L-9 25 L-5 25 C-4 29 -3 33 0 36 L-3 39 L1 43 L4 40 C7 42 11 42 15 41 L18 44 L23 40 L20 36 C23 33 25 30 26 26 L30 26 Z" />
    <circle cx="10" cy="22" r="7" fill="#ffffff" />
  </g>

  <!-- Student Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="145" r="48" fill="#3b82f6" />
  <circle cx="200" cy="145" r="44" fill="#1e40af" />
  <!-- Hair / Cap contour -->
  <path d="M165 140 C165 105 235 105 235 140 C220 125 180 125 165 140 Z" fill="#0f172a" />
  
  <!-- Torso & Shoulders -->
  <path d="M125 270 C125 210 160 195 200 195 C240 195 275 210 275 270 C275 295 125 295 125 270 Z" fill="#2563eb" />
  <!-- Collar / Shirt Detail -->
  <path d="M185 196 L200 225 L215 196 Z" fill="#ffffff" />
  <path d="M200 225 L200 270" stroke="#1d4ed8" stroke-width="2" />

  <!-- Badge Pill at Bottom -->
  <rect x="90" y="325" width="220" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
  <circle cx="112" cy="344" r="5" fill="#10b981" />
  <text x="126" y="349" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" letter-spacing="0.5">
    PHOTO PLACEHOLDER
  </text>
</svg>
